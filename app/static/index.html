<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam 饰品自动上架</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">LOCAL MARKET CONTROL</p>
          <h1>Steam 饰品自动上架</h1>
          <p class="subtle">本机运行 · 手机手动确认 · 默认演练模式</p>
        </div>
        <span id="health" class="pill">正在检查服务</span>
      </header>

      <section class="notice">
        <strong id="mode-label">演练模式。</strong>
        默认禁止真实市场写入；启用真实操作需要同时修改两个环境变量并输入确认文本。
      </section>

      <section class="grid">
        <article class="card">
          <span>登录状态</span>
          <strong id="session-state">读取中</strong>
          <small id="session-message"></small>
          <div class="actions">
            <button id="login" type="button">登录 Steam</button>
            <button id="logout" class="secondary" type="button">退出</button>
          </div>
        </article>
        <article class="card"><span>可出售</span><strong id="sellable">0</strong></article>
        <article class="card"><span>待手机确认</span><strong id="pending">0</strong></article>
        <article class="card"><span>当前在售</span><strong id="active">0</strong></article>
      </section>

      <section class="panel">
        <div class="panel-title">
          <div>
            <p class="eyebrow">PRICING ENGINE</p>
            <h2>30 天定价策略</h2>
          </div>
          <select id="currency">
            <option value="CNY">人民币 CNY</option>
            <option value="INR">印度卢比 INR</option>
          </select>
        </div>
        <div id="strategies" class="strategy-list"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <div>
            <p class="eyebrow">INVENTORY</p>
            <h2>可出售库存</h2>
          </div>
          <div class="actions">
            <button id="sync-inventory" type="button">同步库存</button>
            <button id="sync-prices" class="secondary" type="button">同步30天价格</button>
          </div>
        </div>
        <div class="plan-bar">
          <select id="plan-strategy">
            <option value="robust_median">稳健中位价</option>
            <option value="trend">趋势价</option>
            <option value="market_follow">市场跟随价</option>
            <option value="fast_sell">快速出售价</option>
          </select>
          <label>最低到账 <input id="minimum-price" type="number" min="0.01" step="0.01" value="0.01" /></label>
          <label>单件支付上限 <input id="maximum-price" type="number" min="0.03" step="0.01" value="1000" /></label>
          <label>批次上限 <input id="maximum-items" type="number" min="1" max="5000" value="2000" /></label>
          <label>排除名称 <input id="excluded-names" class="wide-input" placeholder="用逗号分隔完整市场名称" /></label>
          <button id="create-plans" type="button">为全部库存生成计划</button>
        </div>
        <p id="sync-status" class="sync-status">尚未开始同步</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>游戏</th><th>物品</th><th>数量</th><th>可交易</th></tr></thead>
            <tbody id="inventory-body"><tr><td colspan="4">尚未同步库存</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <div>
            <p class="eyebrow">LISTINGS</p>
            <h2>上架任务</h2>
          </div>
          <div class="actions">
            <button id="sync-listings" class="secondary" type="button">同步挂单状态</button>
            <button id="execute-plans" class="danger" type="button">执行所有待提交计划</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>状态</th><th>物品</th><th>策略</th><th>卖家到账</th><th>买家支付</th></tr></thead>
            <tbody id="listings-body"><tr><td colspan="5">暂无任务</td></tr></tbody>
          </table>
        </div>
      </section>
      <p id="toast" class="toast" hidden></p>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
