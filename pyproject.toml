[project]
name = "steam-market-auto-lister"
version = "1.2.0"
description = "本地运行的 Steam 市场饰品自动上架与重定价工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "playwright>=1.51,<2",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
